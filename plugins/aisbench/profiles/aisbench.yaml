id: aisbench
role: benchmark
workloads:
  dataset:
    scenario: native
    fields: { backend: backend, dataset: datasets, requests: dataCount, stream: stream }
  synthetic-text:
    scenario: native
    fields: { inputTokens: syntheticWorkload.inputLength, outputTokens: syntheticWorkload.outputLength, requests: dataCount, prefixCache: syntheticWorkload.prefixCache }
    defaults: { syntheticText: true }
  synthetic-multimodal:
    scenario: native
    fields: { images: multimodalGeneration.imageScenario, textTokens: multimodalGeneration.textTokens, requests: dataCount, outputTokens: maxOutputTokens, manifest: multimodalManifest, action: multimodalAction }
  native:
    scenario: native
    fields: { args: nativeArgs, file: configFile, files: files }
extends: aisbench-native
defaultVersion: "1.0"
defaultScenario: standard
versions:
  "1.0": {}
plugin:
  name: aisbench
scenarios:
  standard:
    plugin:
      name: aisbench
      config:
        workload:
          inputLength: 2048
          outputLength: 512
          dataCount: 160
          concurrency: 16
          requestRate: 0
    defaults:
      benchmark:
        evaluationScenario: inference-engine
      metrics: [aisbench-performance, duration, usage]
      reporter: aisbench-markdown
  native:
    plugin:
      name: aisbench-native
