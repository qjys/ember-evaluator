id: aisbench
role: benchmark
extends: aisbench-native
defaultVersion: "1.0"
defaultScenario: standard
versions:
  "1.0": {}
plugin:
  name: aisbench
scenarios:
  standard:
    plugin:
      name: aisbench
      config:
        workload:
          inputLength: 2048
          outputLength: 512
          dataCount: 160
          concurrency: 16
          requestRate: 0
    defaults:
      benchmark:
        evaluationScenario: inference-engine
      metrics: [aisbench-performance, duration, usage]
      reporter: aisbench-markdown
  native:
    plugin:
      name: aisbench-native
