# Use an already running vLLM Ascend service with metrics and profiler export enabled.
hardware: npu
services:
  default:
    model: ${MODEL_NAME}
    base_url: ${MODEL_ENDPOINT}
    api_key: ${MODEL_API_KEY}
benchmark:
  name: agentx
  scenario: replay
  config:
    traceCount: 8
    concurrency: [1, 8]
    measurementMode: all   # performance | profiling | all
    profiling:
      provider: vllm
      preset: full         # Default: one diagnostic replay per concurrency, all available categories
      devices: [0, 1]      # Set to the physical NPUs of the local serving instance
      # Mount this directory at the same absolute path on the service and evaluator.
      traceDirectory: /data/shared/agentx-traces
      traceCount: 8        # Compare identical session trees at both concurrency levels
      # service: diagnostic   # Optional entry in services serving the same model.
      exportTimeoutSeconds: 1800
  solver:
    config:
      tokenizer: ${AGENTX_TOKENIZER}
environment: local
output:
  directory: ../../results/agentx-service-profiling
